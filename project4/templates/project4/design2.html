<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Design 2: Movie Ranking</title>

    <style>
        body { font-family: Arial, sans-serif; background:#f4f4f9; margin:0; padding:40px; }
        .container { max-width:500px; margin:auto; background:white; padding:30px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,.1); text-align:center; }
        ul { list-style:none; padding:0; }
        li { display:flex; align-items:center; background:#e9ecef; margin:8px 0; padding:12px; border-radius:5px; cursor:grab; }
        .rank { width:30px; font-weight:bold; }
        .movie { flex:1; }
        .dragging { opacity:.5; }
        button { width:100%; padding:12px; background:#28a745; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer; }
        .message { background:#d4edda; color:#155724; padding:10px; border-radius:5px; margin-bottom:15px; }
        .back { display:inline-block; margin-top:20px; color:#555; text-decoration:none; }
    </style>
</head>

<body>

<div class="container">

    <h1>Design 2: Movie Ranking</h1>

    <p>
        Drag the ten movies from your most preferred
        to your least preferred.
    </p>

    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    <ul id="movie-list">
        {% for movie in movies %}
            <li draggable="true" data-id="{{ movie }}">
                <span class="rank">{{ forloop.counter }}.</span>
                <span class="movie">{{ movie }}</span>
            </li>
        {% endfor %}
    </ul>

    <form method="POST" id="ranking-form">
        {% csrf_token %}

        <input type="hidden" name="ranked_order" id="ranked_order">

        <button type="submit">Submit Ranking</button>
    </form>

    <a href="{% url 'project4:index' %}" class="back">
        ← Back to Project 4
    </a>

</div>

<script>
    const list = document.getElementById("movie-list");
    let dragged = null;

    list.addEventListener("dragstart", e => {
        if (e.target.tagName === "LI") {
            dragged = e.target;
            dragged.classList.add("dragging");
        }
    });

    list.addEventListener("dragend", () => {
        dragged.classList.remove("dragging");
        dragged = null;
        updateRanks();
    });

    list.addEventListener("dragover", e => {
        e.preventDefault();

        const items = [...list.querySelectorAll("li:not(.dragging)")];

        const next = items.find(item => {
            const box = item.getBoundingClientRect();
            return e.clientY < box.top + box.height / 2;
        });

        if (next) {
            list.insertBefore(dragged, next);
        } else {
            list.appendChild(dragged);
        }
    });

    function updateRanks() {
        list.querySelectorAll("li").forEach((item, index) => {
            item.querySelector(".rank").textContent = (index + 1) + ".";
        });
    }

    document.getElementById("ranking-form").addEventListener("submit", () => {
        const ranking = [...list.querySelectorAll("li")]
            .map(item => item.dataset.id);

        document.getElementById("ranked_order").value = ranking.join("||");
    });
</script>

</body>
</html>
