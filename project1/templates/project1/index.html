<!DOCTYPE html>
<html>
<head>
    <title>Project 1: ML Interface</title>

    <style>
        body { margin:0; font-family:Arial,sans-serif; background:#f5f7fb; color:#243b53; }
        .page { max-width:900px; margin:45px auto; padding:25px; }
        .box { background:white; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,.08); text-align:center; margin-bottom:30px; }
        h1 { font-size:36px; margin-bottom:10px; }
        p { color:#666; }
        input { padding:10px; border:1px solid #ccc; border-radius:6px; }
        button { padding:11px 20px; background:#147df5; color:white; border:0; border-radius:7px; font-weight:bold; cursor:pointer; }
        button:hover { background:#0f68d7; }
        img { width:100%; max-width:800px; border-radius:8px; margin-top:15px; }
        .results { display:flex; gap:15px; justify-content:center; flex-wrap:wrap; margin-top:25px; }
        .card { background:#f8fafc; padding:18px; border-radius:8px; min-width:150px; }
        .accuracy { color:#27ae60; font-size:22px; font-weight:bold; }
    </style>
</head>

<body>

{% include "home/navbar.html" %}

<div class="page">

    <div class="box">
        <h1>Automated Machine Learning</h1>
        <p>Upload a CSV file to visualize the data and train a KNN model.</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="csv_file" accept=".csv" required>
            <button type="submit">Upload & Train Model</button>
        </form>
    </div>

    {% if plot_url %}
    <div class="box">

        <h2>Data Visualization</h2>
        <img src="{{ plot_url }}" alt="Data Plot">

        <div class="results">
            <div class="card"><strong>Model</strong><br>KNN</div>
            <div class="card"><strong>Split</strong><br>80% / 20%</div>
            <div class="card"><strong>Best k</strong><br>{{ best_k }}</div>
            <div class="card"><strong>Accuracy</strong><br><span class="accuracy">{{ accuracy }}%</span></div>
        </div>

    </div>
    {% endif %}

</div>

</body>
</html>
